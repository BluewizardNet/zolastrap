{% extends "base.html" %}

{% block title %}
	{{config.title}} - {{taxonomy.name}}: {{term.name}}
{% endblock %}

{% block content %}
  <h1>{{config.extra.tag}}: {{term.name}}</h1>
	{% for page in paginator.pages %}
    {{<post.render page={page} />}}
	{% endfor %}
  {{<paginator.render paginator={paginator} />}}
{% endblock %}
